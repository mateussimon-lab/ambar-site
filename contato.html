      <section class="section section--tight">
        <div class="container contact-layout">
          <form class="form" name="contato" method="POST" action="/" data-netlify="true" netlify-honeypot="bot-field" data-contact-form>
            <input type="hidden" name="form-name" value="contato">
            <input type="hidden" name="subject" value="Contato pelo site da Âmbar Arquitetura">
            <p hidden><label>Não preencha este campo: <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
            <label class="field">
              <span>Nome</span>
              <input name="name" type="text" autocomplete="name" required>
            </label>
            <label class="field">
              <span>E-mail</span>
              <input name="email" type="email" autocomplete="email" required>
            </label>
            <label class="field">
              <span>Telefone</span>
              <input name="phone" type="tel" autocomplete="tel">
            </label>
            <label class="field">
              <span>Mensagem</span>
              <textarea name="message" required></textarea>
            </label>
            <button class="button button--filled" type="submit">Enviar mensagem</button>
            <p class="form-message" data-form-message></p>
          </form>
          <div class="map">
            <iframe data-map title="Mapa até a Âmbar Arquitetura" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
        </div>
      </section>
